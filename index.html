<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARHHAMER SURVIVOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container terminal">
        <header class="header">
            <h1 class="title-arc">WARHHAMER SURVIVOR</h1>
            <div class="controls controls-top">
                <button id="btn-iniciar" onclick="iniciarJuego()">Iniciar</button>
                <button id="btn-pausar" onclick="pausarJuego()" class="hidden">Pausar</button>
                <button id="btn-reiniciar" onclick="reiniciarJuego()" class="hidden">Reiniciar</button>
            </div>
            <div class="legend hidden" aria-label="Leyenda">
                <span class="legend-item legend-sprite">
                    <img class="legend-img" src="Modelos PJ/Jugador/Jugador Estatico.png" alt="Jugador" />
                    <span>Jugador</span>
                </span>
                <span class="legend-item legend-sprite">
                    <img class="legend-img" src="Modelos PJ/Enemigo/Enemigo estatico 2.png" alt="Enemigo" />
                    <span>Enemigo</span>
                </span>
            </div>
        </header>

        <div id="game-bar" class="game-bar hidden" aria-label="Controles de juego">
            <div class="game-bar-group">
                <span class="label">Velocidad:</span>
                <div class="speed-buttons">
                    <button id="vel-lenta" class="speed-btn" onclick="setVelocidadLenta()">Lenta</button>
                    <button id="vel-normal" class="speed-btn" onclick="setVelocidadNormal()">Normal</button>
                    <button id="vel-rapida" class="speed-btn" onclick="setVelocidadRapida()">Rápida</button>
                </div>
            </div>
        </div>

        <div class="game-info hidden" role="status" aria-live="polite">
            <div class="info-item">
                <span class="label">Jugadores vivos:</span>
                <span id="jugadores-vivos">0</span>
            </div>
            <div class="info-item">
                <span class="label">Ronda:</span>
                <span id="ronda-actual">1</span>
            </div>
            <div class="info-item">
                <span class="label">Enemigos vivos:</span>
                <span id="enemigos-vivos">0</span>
            </div>
            <div class="info-item">
                <span class="label">Estado:</span>
                <span id="estado-juego">Pulsa Iniciar para jugar</span>
            </div>
        </div>
        <div id="tablero-container" class="screen hidden" aria-label="Pantalla de juego">
            <canvas id="game-canvas" aria-label="Canvas del juego"></canvas>
        </div>

        <!-- Modal entre rondas -->
        <div id="modal-ronda" class="modal-overlay hidden" aria-modal="true" aria-labelledby="modal-ronda-titulo">
            <div class="modal-ronda-contenido">
                <h2 id="modal-ronda-titulo" class="modal-ronda-titulo">¿Quieres pasar de ronda?</h2>
                <p id="modal-ronda-jugadores" class="modal-ronda-info">Jugadores restantes: <span id="modal-jugadores-count">0</span></p>
                <button id="modal-ronda-aceptar" class="modal-ronda-btn" onclick="confirmarPasarRonda()">Sí, pasar ronda</button>
            </div>
        </div>
    </div>
    <script src="jugador.js"></script>
    <script src="principal.js"></script>
    <script src="enemigo.js"></script>
    <script src="obstaculo.js"></script>
    <script src="controlTablero.js"></script>
    <script src="juego.js"></script>
    <script src="main.js"></script>
</body>
</html>
