<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARHHAMER SURVIVOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container terminal">
        <div id="main-menu" class="main-menu-overlay" aria-label="Menú principal">
            <div class="main-menu-frame" role="dialog" aria-modal="true">
                <div class="main-menu-spacer main-menu-spacer-top"></div>
                <button
                    id="btn-menu-iniciar"
                    class="menu-action menu-action-primary"
                    type="button"
                    aria-label="INICIAR JUEGO"
                    onclick="iniciarJuego()"
                >
                    INICIAR JUEGO
                </button>
                <div class="main-menu-spacer main-menu-spacer-mid"></div>
                <button
                    id="btn-menu-salir"
                    class="menu-action menu-action-secondary"
                    type="button"
                    aria-label="SALIR"
                    onclick="salirPrograma()"
                >
                    SALIR
                </button>
                <div class="main-menu-spacer main-menu-spacer-bottom"></div>
            </div>
        </div>
        <header class="header">
            <h1 class="title-arc">WARHHAMER SURVIVOR</h1>
        </header>

        <div class="game-info hidden" role="status" aria-live="polite">
            <div class="hud-side hud-left info-item hidden">
                <span class="label">Aliados vivos:</span>
                <span id="jugadores-vivos">0</span>
            </div>

            <div class="hud-center">
                <span class="label">Ronda</span>
                <span id="ronda-actual">1</span>
            </div>

            <div class="hud-side hud-right info-item hidden">
                <span class="label">Enemigos vivos:</span>
                <span id="enemigos-vivos">0</span>
            </div>

            <div class="hud-status info-item">
                <span class="label">Estado:</span>
                <span id="estado-juego">Pulsa Iniciar para jugar</span>
            </div>
        </div>
        <div id="tablero-container" class="screen hidden" aria-label="Pantalla de juego">
            <div id="board-canvas-wrap" class="board-canvas-wrap">
                <canvas id="game-canvas" aria-label="Canvas del juego"></canvas>
            </div>

            <div id="controls-bottom" class="controls-bottom hidden" aria-label="Controles del juego">
                <button id="btn-toggle-pausa" class="control-btn control-btn-primary" type="button" onclick="togglePausa()">PAUSAR</button>
                <button id="btn-vel-x1" class="control-btn control-btn-speed" type="button" onclick="setVelocidadX1()">VELOCIDAD x1</button>
                <button id="btn-vel-x2" class="control-btn control-btn-speed" type="button" onclick="setVelocidadX2()">VELOCIDAD x2</button>
                <button id="btn-vel-x3" class="control-btn control-btn-speed" type="button" onclick="setVelocidadX3()">VELOCIDAD x3</button>
            </div>
        </div>

        <!-- Modal entre rondas -->
        <div id="modal-ronda" class="modal-overlay hidden" aria-modal="true" aria-labelledby="modal-ronda-titulo">
            <div class="modal-ronda-contenido">
                <h2 id="modal-ronda-titulo" class="modal-ronda-titulo">FIN DE RONDA</h2>
                <p id="modal-ronda-jugadores" class="modal-ronda-info">Aliados vivos: <span id="modal-jugadores-count">0</span></p>
                <button id="modal-ronda-aceptar" class="modal-ronda-btn" onclick="confirmarPasarRonda()">CONTINUAR</button>
            </div>
        </div>
    </div>
    <script src="jugador.js"></script>
    <script src="principal.js"></script>
    <script src="enemigo.js"></script>
    <script src="obstaculo.js"></script>

    <script src="entities.js"></script>
    <script src="movement.js"></script>
    <script src="combat.js"></script>
    <script src="rounds.js"></script>
    <script src="renderer.js"></script>
    <script src="game.js"></script>

    <script src="main.js"></script>
</body>
</html>
